<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EARTH — Three.js Photorealistic Simulation</title>
  <meta name="description" content="A photorealistic, interactive 3D Earth built with Three.js — PBR surface, animated clouds, atmospheric scattering and city lights on the night side." />
  <style>
    /* ---------- page chrome (everything visual is the WebGL canvas) ---------- */
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #000; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }                     /* full-screen, resize handled in JS */

    /* cinematic vignette + hint overlays (purely decorative, never block input) */
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 5;
      background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.42) 100%);
    }
    .hint {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 6; pointer-events: none; white-space: nowrap;
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(190, 210, 255, .5);
      text-shadow: 0 1px 8px rgba(0,0,0,.8);
      transition: opacity 1.2s ease;
    }
    .hint.fade { opacity: 0; }

    /* loading veil shown until every texture has decoded */
    #loader {
      position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
      background: #000; transition: opacity .9s ease;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #loader .ring {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid rgba(120, 160, 255, .18);
      border-top-color: #6ea8ff;
      animation: spin 1s linear infinite;
    }
    #loader p {
      font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
      color: rgba(190, 210, 255, .65);
    }
    #loader .err { color: #ff7b7b; max-width: 420px; text-align: center; line-height: 1.6; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>
  <div class="hint" id="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div>
  <div id="loader"><div class="box"><div class="ring"></div><p id="loadmsg">Loading textures</p></div></div>

  <!-- ------------------------------------------------------------------ -->
  <!--  Import map: latest Three.js + addons straight from a CDN           -->
  <!-- ------------------------------------------------------------------ -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    /* ==================================================================== */
    /*  CONFIG — every tunable knob in one place                            */
    /* ==================================================================== */
    const CONFIG = {
      // Geometry radii are baked into each SphereGeometry (no mesh scaling),
      // so normals stay clean for lighting + the fresnel shader.
      earth:      { radius: 1.0,   segments: 128 },   // high-res sphere (>= 64x64)
      clouds:     { radius: 1.012, segments: 96  },   // ~1.01x — just above the surface
      atmosphere: { radius: 1.18,  segments: 64  },   // ~1.18x — scattering shell
      spin:       { earth: 0.028, clouds: 0.036 },    // rad/s — clouds drift slightly faster
      axialTilt:  THREE.MathUtils.degToRad(23.4),     // applied to the earth+clouds group
      sun:        { direction: new THREE.Vector3(0.55, 0.18, 0.81) }, // off-center "sun"
      stars:      { count: 7000, radiusMin: 60, radiusMax: 130 },
      camera:     { fov: 45, near: 0.1, far: 600, start: new THREE.Vector3(0, 0.9, 3.5),
                    minDistance: 1.6, maxDistance: 12 },
    };
    CONFIG.sun.direction.normalize();

    // Open-source texture set (three.js example assets, NASA-derived, public domain).
    const TEXTURES = {
      day:      'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
      normal:   'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
      specular: 'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
      clouds:   'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
      lights:   'https://threejs.org/examples/textures/planets/earth_lights_2048.png',
    };

    /* ==================================================================== */
    /*  SHARED UNIFORMS — updated once, referenced by every compiled shader */
    /* ==================================================================== */
    const uniforms = {
      sunDirection: { value: CONFIG.sun.direction.clone() }, // world space
    };

    /* ==================================================================== */
    /*  RENDERER / SCENE / CAMERA                                           */
    /* ==================================================================== */
    const container = document.getElementById('app');

    const renderer = new THREE.WebGLRenderer({
      antialias: true,                 // smooth sphere silhouettes
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // crisp, not wasteful
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;           // cinematic response curve
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;                            // cloud shadows
    renderer.shadowMap.type = THREE.PCFShadowMap;                 // (PCFSoft was removed in r186)
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      CONFIG.camera.fov,
      window.innerWidth / window.innerHeight,
      CONFIG.camera.near,
      CONFIG.camera.far,
    );
    camera.position.copy(CONFIG.camera.start);

    /* ==================================================================== */
    /*  ASSET LOADING — one manager drives the veil + progress text         */
    /* ==================================================================== */
    const loaderEl = document.getElementById('loader');
    const loadMsgEl = document.getElementById('loadmsg');

    const manager = new THREE.LoadingManager(
      () => { loaderEl.classList.add('done'); window.__earth.ready = true; },
      (_url, loaded, total) => { loadMsgEl.textContent = `Loading textures ${Math.round((loaded / total) * 100)}%`; },
      (url) => {
        loadMsgEl.classList.add('err');
        loadMsgEl.textContent = `Failed to load texture: ${url}`;
      },
    );
    const texLoader = new THREE.TextureLoader(manager);
    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    /** Load a texture and mark it as color (sRGB) or data (linear). */
    function loadTexture(url, isColor) {
      const t = texLoader.load(url);
      t.colorSpace = isColor ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      t.anisotropy = maxAniso;
      return t;
    }

    /** Invert a texture on a canvas — used to turn the specular map into a roughness map
     *  (white = water in the specular map → black = smooth/reflective in roughness). */
    function invertToCanvasTexture(sourceTexture) {
      const img = sourceTexture.image;
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const px = data.data;
      for (let i = 0; i < px.length; i += 4) {
        px[i] = 255 - px[i];         // r
        px[i + 1] = 255 - px[i + 1]; // g
        px[i + 2] = 255 - px[i + 2]; // b
      }
      ctx.putImageData(data, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.NoColorSpace;  // data map, not color
      tex.anisotropy = maxAniso;
      return tex;
    }

    /* ==================================================================== */
    /*  EARTH — PBR surface + dynamic night-side city lights                 */
    /* ==================================================================== */
    function buildEarth() {
      const dayMap    = loadTexture(TEXTURES.day, true);
      const normalMap = loadTexture(TEXTURES.normal, false);
      const lightsMap = loadTexture(TEXTURES.lights, true);

      const material = new THREE.MeshStandardMaterial({
        map: dayMap,
        normalMap,
        normalScale: new THREE.Vector2(0.9, 0.9), // mountainous terrain depth
        roughness: 1.0,
        metalness: 0.0,
        emissive: new THREE.Color(0xffffff),
        emissiveMap: lightsMap,                   // city lights …
        emissiveIntensity: 2.4,
      });

      // Derive the roughness map from the specular texture once it decodes:
      // white water in the specular map → black (smooth, reflective) in roughness.
      texLoader.load(TEXTURES.specular, (specTex) => {
        specTex.colorSpace = THREE.NoColorSpace;
        specTex.anisotropy = maxAniso;
        material.roughnessMap = invertToCanvasTexture(specTex);
        material.needsUpdate = true;
      });

      /* --- The night-lights magic -----------------------------------------
       * MeshStandardMaterial lights the emissive map everywhere; we patch the
       * shader so city lights are multiplied by a smooth terminator factor:
       *   1.0 on the far (night) side → 0.0 on the lit side.
       * The factor comes from the world-space angle between the surface
       * normal and the sun direction — hence the smooth fade across the
       * day/night boundary. */
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uSunDirection = uniforms.sunDirection;

        shader.vertexShader = shader.vertexShader
          .replace('#include <common>',
            '#include <common>\nvarying vec3 vWorldNormal;')
          .replace('#include <beginnormal_vertex>',
            '#include <beginnormal_vertex>\nvWorldNormal = normalize(mat3(modelMatrix) * objectNormal);');

        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>',
            '#include <common>\nuniform vec3 uSunDirection;\nvarying vec3 vWorldNormal;')
          .replace('#include <emissivemap_fragment>',
            `#include <emissivemap_fragment>
             float sunDot = dot(normalize(vWorldNormal), uSunDirection);
             float nightFactor = 1.0 - smoothstep(-0.05, 0.15, sunDot); // soft terminator
             totalEmissiveRadiance *= nightFactor;`);
      };

      const mesh = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.earth.radius, CONFIG.earth.segments, CONFIG.earth.segments), material);
      mesh.receiveShadow = true;    // clouds cast shadows onto the surface
      mesh.castShadow = false;      // avoid self-shadowing artifacts
      return mesh;
    }

    /* ==================================================================== */
    /*  CLOUDS — transparent shell that also casts patterned shadows         */
    /* ==================================================================== */
    function buildClouds() {
      const cloudsMap = loadTexture(TEXTURES.clouds, true);

      const material = new THREE.MeshStandardMaterial({
        map: cloudsMap,                       // white cloud tops (with alpha channel)
        alphaMap: cloudsMap,                  // alpha from the same texture's luminance
        transparent: true,
        alphaTest: 0.12,                      // keeps depth sorting clean + shadow pass usable
        depthWrite: false,                    // let the atmosphere blend through
        roughness: 1.0,
        metalness: 0.0,
      });

      /* CRITICAL for concentric shells:
       * Three.js flips the depth-material side for shadows (FrontSide → BackSide,
       * the classic "render backfaces" anti-acne trick). For a shell that wraps the
       * planet, the backface depth is the FAR hemisphere — which sits BEHIND the
       * Earth — so the shell would never shadow anything. Forcing `shadowSide` back
       * to FrontSide renders the sun-facing cloud surface into the shadow map. */
      material.shadowSide = THREE.FrontSide;

      const mesh = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.clouds.radius, CONFIG.clouds.segments, CONFIG.clouds.segments), material);
      mesh.castShadow = true;                 // ← cloud shadows on the surface below
      mesh.receiveShadow = false;

      /* The shadow pass auto-derives a depth material from the visible material
       * (map + alphaTest above), so cloud texels — and only cloud texels — cast
       * soft, cloud-shaped shadows onto the surface beneath. */
      return mesh;
    }

    /* ==================================================================== */
    /*  ATMOSPHERE — custom fresnel "light scattering" shell                 */
    /* ==================================================================== */
    function buildAtmosphere() {
      const material = new THREE.ShaderMaterial({
        side: THREE.BackSide,               // render the far side — the visible halo is the rim
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uSunDirection: uniforms.sunDirection,
          uColor:   { value: new THREE.Color(0x5b9dff) },  // scattering blue
          uIntensity: { value: 2.6 },
          uPower:   { value: 3.4 },                        // halo falloff sharpness
        },
        vertexShader: /* glsl */`
          varying vec3 vWorldNormal;
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPos.xyz;
            vWorldNormal = normalize(mat3(modelMatrix) * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }`,
        fragmentShader: /* glsl */`
          uniform vec3  uSunDirection;
          uniform vec3  uColor;
          uniform float uIntensity;
          uniform float uPower;
          varying vec3 vWorldNormal;
          varying vec3 vWorldPosition;

          void main() {
            vec3 viewDir = normalize(cameraPosition - vWorldPosition);
            vec3 normal  = normalize(vWorldNormal);

            // Fresnel rim: strongest where our line of sight grazes the shell.
            float rim = pow(1.0 - abs(dot(viewDir, normal)), uPower);

            // Sun-side bias: scattered light is brighter on the lit hemisphere,
            // so the halo subtly hugs the day side and fades into night.
            float sunFacing = clamp(dot(normal, uSunDirection) * 0.5 + 0.5, 0.0, 1.0);
            float intensity = rim * uIntensity * mix(0.28, 1.0, sunFacing);

            gl_FragColor = vec4(uColor, intensity);

            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
      });

      return new THREE.Mesh(new THREE.SphereGeometry(CONFIG.atmosphere.radius, CONFIG.atmosphere.segments, CONFIG.atmosphere.segments), material);
    }

    /* ==================================================================== */
    /*  STARFIELD — procedural points, per-star size / brightness / tint     */
    /* ==================================================================== */
    function buildStars() {
      const { count, radiusMin, radiusMax } = CONFIG.stars;
      const positions  = new Float32Array(count * 3);
      const sizes      = new Float32Array(count);
      const brightness = new Float32Array(count);
      const tints      = new Float32Array(count * 3);

      const tint = new THREE.Color();
      for (let i = 0; i < count; i++) {
        // uniform direction on a sphere → point on a spherical shell
        const u = Math.random() * 2 - 1;
        const theta = Math.random() * Math.PI * 2;
        const r = radiusMin + Math.random() * (radiusMax - radiusMin);
        const s = Math.sqrt(1 - u * u);
        positions[i * 3 + 0] = s * Math.cos(theta) * r;
        positions[i * 3 + 1] = u * r;
        positions[i * 3 + 2] = s * Math.sin(theta) * r;

        sizes[i] = 0.6 + Math.pow(Math.random(), 3) * 2.6;   // mostly small, few large
        brightness[i] = 0.35 + Math.random() * 0.85;

        // subtle color temperature: white → pale blue → warm
        const roll = Math.random();
        tint.setHSL(roll < 0.6 ? 0.6 : roll < 0.85 ? 0.55 : 0.08, roll < 0.6 ? 0.25 : 0.45, 0.92);
        tints[i * 3 + 0] = tint.r; tints[i * 3 + 1] = tint.g; tints[i * 3 + 2] = tint.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute('aBrightness', new THREE.BufferAttribute(brightness, 1));
      geometry.setAttribute('aTint', new THREE.BufferAttribute(tints, 3));

      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: /* glsl */`
          uniform float uPixelRatio;
          attribute float aSize;
          attribute float aBrightness;
          attribute vec3  aTint;
          varying float vBrightness;
          varying vec3  vTint;
          void main() {
            vBrightness = aBrightness;
            vTint = aTint;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            // perspective size attenuation, clamped so stars stay pin-sharp
            gl_PointSize = clamp(aSize * (300.0 / -mvPosition.z), 0.75, 5.0) * uPixelRatio;
            gl_Position = projectionMatrix * mvPosition;
          }`,
        fragmentShader: /* glsl */`
          varying float vBrightness;
          varying vec3  vTint;
          void main() {
            vec2 p = gl_PointCoord - 0.5;
            float d = length(p);
            if (d > 0.5) discard;
            float core = smoothstep(0.5, 0.0, d);
            gl_FragColor = vec4(vTint, pow(core, 2.2) * vBrightness);

            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`,
      });
      material.uniforms.uPixelRatio = { value: Math.min(window.devicePixelRatio, 2) };

      return new THREE.Points(geometry, material);
    }

    /* ==================================================================== */
    /*  LIGHTING — one strong sun + whisper of ambient                      */
    /* ==================================================================== */
    function buildLights() {
      const sun = new THREE.DirectionalLight(0xfff4e5, 3.4);
      sun.position.copy(CONFIG.sun.direction).multiplyScalar(30);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);

      /* Tight frustum around the globe, then EXPLICITLY update the projection —
       * three only calls updateProjectionMatrix() for a shadow camera at map
       * creation, so later changes would otherwise be silently ignored.
       * The shadow bias is expressed in NORMALIZED depth units, so a long
       * near→far span would turn a tiny bias into a world-space gap big enough
       * to swallow the ~0.012 cloud↔surface separation entirely. */
      sun.shadow.camera.near = 27;
      sun.shadow.camera.far = 33;
      sun.shadow.camera.left = -1.4;
      sun.shadow.camera.right = 1.4;
      sun.shadow.camera.top = 1.4;
      sun.shadow.camera.bottom = -1.4;
      sun.shadow.camera.updateProjectionMatrix();
      sun.shadow.bias = -0.00002;
      sun.shadow.normalBias = 0.0005;
      scene.add(sun);

      // Barely-there fill so the dark side reads as "night", not "void".
      scene.add(new THREE.AmbientLight(0x223355, 0.02));
      return sun;
    }

    /* ==================================================================== */
    /*  SCENE ASSEMBLY                                                       */
    /* ==================================================================== */
    const earth    = buildEarth();
    const clouds   = buildClouds();
    const atmosphere = buildAtmosphere();
    const stars    = buildStars();
    const sun      = buildLights();

    // Earth + clouds share a 23.4° axial tilt; each spins independently on Y.
    const planetGroup = new THREE.Group();
    planetGroup.rotation.z = -CONFIG.axialTilt;
    planetGroup.add(earth, clouds);

    scene.add(planetGroup, atmosphere, stars);

    /* ==================================================================== */
    /*  CAMERA CONTROLS — heavy, cinematic orbit                             */
    /* ==================================================================== */
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;              // inertia on drag — smooth + weighty
    controls.dampingFactor = 0.055;
    controls.rotateSpeed = 0.45;
    controls.zoomSpeed = 0.7;
    controls.enablePan = false;                 // Earth stays centered, always
    controls.minDistance = CONFIG.camera.minDistance; // never dive into the globe
    controls.maxDistance = CONFIG.camera.maxDistance; // never drift into the void
    controls.target.set(0, 0, 0);

    /* ==================================================================== */
    /*  RESIZE — keep the aspect ratio honest, never stretch                 */
    /* ==================================================================== */
    function onResize() {
      const w = window.innerWidth, h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(w, h);
      stars.material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
    }
    window.addEventListener('resize', onResize);
    onResize();

    /* ==================================================================== */
    /*  ANIMATION LOOP                                                       */
    /* ==================================================================== */
    let prevTime = performance.now();

    renderer.setAnimationLoop(() => {          // rAF loop, vsync-aligned
      const now = performance.now();
      const dt = Math.min((now - prevTime) / 1000, 0.05); // guard against tab-switch spikes
      prevTime = now;

      // slow, continuous spins — clouds a touch faster than the ground below
      earth.rotation.y  += CONFIG.spin.earth  * dt;
      clouds.rotation.y += CONFIG.spin.clouds * dt;

      controls.update();                        // damping needs per-frame update
      renderer.render(scene, camera);
    });

    /* Fade the hint away after the first interaction (or 7 s, whichever first). */
    const hintEl = document.getElementById('hint');
    const fadeHint = () => hintEl.classList.add('fade');
    renderer.domElement.addEventListener('pointerdown', fadeHint, { once: true });
    setTimeout(fadeHint, 7000);

    /* Expose internals for debugging / console tinkering. */
    window.__earth = { THREE, scene, camera, renderer, controls, earth, clouds, atmosphere, stars, sun, uniforms, ready: false };
  </script>
</body>
</html>
