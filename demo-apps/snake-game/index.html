<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="NeonSnake — a neon retro Snake arcade game in vanilla canvas. Arrow keys / WASD or swipe.">
<title>NeonSnake — canvas Snake arcade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <h1 class="brand">NEON<span>SNAKE</span></h1>
      <dl class="hud" aria-label="Game statistics">
        <div class="hud-item"><dt>Score</dt><dd id="hud-score">0</dd></div>
        <div class="hud-item"><dt>Best</dt><dd id="hud-best">0</dd></div>
        <div class="hud-item"><dt>Level</dt><dd id="hud-level">1</dd></div>
        <div class="hud-item"><dt>Speed</dt><dd id="hud-speed">6.3</dd></div>
      </dl>
    </header>

    <main class="board-wrap" id="board-wrap">
      <div class="board" id="board">
        <canvas id="game" width="600" height="600" role="img"
                aria-label="NeonSnake board: a grid of 20 by 20 cells where the snake eats glowing food."></canvas>
        <div class="overlay" id="overlay">
          <p class="overlay-kicker" id="overlay-kicker">Arcade ready</p>
          <h2 class="overlay-title" id="overlay-title">NEONSNAKE</h2>
          <p class="overlay-sub" id="overlay-sub">Arrow keys / WASD to steer &mdash; or swipe on touch.</p>
          <button type="button" class="btn btn-primary" id="overlay-btn" aria-label="Play NeonSnake">Play</button>
        </div>
      </div>
    </main>

    <footer class="controls">
      <button type="button" class="btn" id="btn-start" aria-label="Start a new game">Start</button>
      <button type="button" class="btn" id="btn-pause" aria-label="Pause the game" disabled>Pause</button>
      <button type="button" class="btn" id="btn-restart" aria-label="Restart the game">Restart</button>
      <p class="hint" id="hint">Arrows / WASD &middot; Space or P to pause &middot; swipe on touch</p>
    </footer>

    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </div>

  <script src="js/game.js" defer></script>
</body>
</html>
